name: CI

on:
  push:
    branches: [ main, refactor-dashboard-config-driven* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest tests/test_config_loader.py tests/test_data_ingestion.py tests/test_dashboard.py tests/test_strategy_contracts.py tests/test_backtest_pipeline.py tests/test_paper_trading.py
