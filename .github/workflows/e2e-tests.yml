name: E2E & Performance Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_duration_hours:
        description: 'Duration for E2E tests (hours)'
        required: false
        default: '1'

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run E2E tests
        run: uv run pytest tests/test_e2e_*.py -v --tb=short --timeout=600
        timeout-minutes: 25

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

  backtest-validation:
    name: Backtest Pipeline Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run backtest validation
        run: uv run python scripts/run_strategy_comparison.py --validation-mode
        timeout-minutes: 25

      - name: Upload backtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-logs
          path: logs/

  notify-results:
    name: Notify Results
    if: always()
    needs: [e2e-tests, backtest-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]] || [[ "${{ needs.backtest-validation.result }}" == "failure" ]]; then
            echo "❌ E2E tests failed!"
            exit 1
          else
            echo "✅ E2E tests passed!"
          fi
