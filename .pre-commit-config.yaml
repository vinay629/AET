# Pre-commit hooks configuration for BAET
# Install: pip install pre-commit
# Setup: pre-commit install
# Test: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
        name: Ruff Linter
      - id: ruff-format
        name: Ruff Formatter

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        name: MyPy Type Checker
        args: [--strict, --show-error-codes]
        additional_dependencies:
          - types-PyYAML
          - pandas-stubs
        files: ^src/

  # Bandit - Security vulnerability scanner
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: Bandit Security Scan
        args: [-r, src/, -f, json]
        pass_filenames: false
        additional_dependencies: [pbr]

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        name: Check YAML Syntax
        args: [--unsafe]
      - id: check-json
        name: Check JSON Syntax
      - id: check-merge-conflict
        name: Check for Merge Conflicts
      - id: end-of-file-fixer
        name: Fix End of File
      - id: trailing-whitespace
        name: Trim Trailing Whitespace

  # Architectural boundary validation
  - repo: local
    hooks:
      - id: validate-imports
        name: Validate Import Boundaries
        entry: python scripts/validate_imports.py
        language: system
        pass_filenames: false
        always_run: true

  # No-commit-to-main safety check
  - repo: local
    hooks:
      - id: no-commit-to-main
        name: Prevent commits to main
        entry: bash -c 'if [[ $(git rev-parse --abbrev-ref HEAD) == "main" ]]; then echo "You are on main branch. Create a feature branch instead."; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
