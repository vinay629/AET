app:
  name: baet
  mode: dev
  logging_level: INFO

market:
  symbols:
    - BTCUSDT
    - ETHUSDT
  timeframes:
    - 1h
    - 4h

storage:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  results_dir: data/results
  logs_dir: logs
  artifacts_dir: artifacts
  models_dir: models

paper:
  enabled: true
  initial_balance: 10000.0
  loop_interval_seconds: 60  # Check every 60 seconds
  stop_on_error: false  # Continue running on errors
  max_consecutive_errors: 10
  notification_webhook: ""  # Optional webhook for alerts
  logging:
    enabled: true
    level: INFO
    directory: logs/paper
    rotation: daily
    max_files: 30

live:
  enabled: false
  require_explicit_confirmation: true
  account_touchpoints:
    - order_submission
    - balance_lookup
    - position_lookup

binance:
  rest_base_url: https://api.binance.com
  websocket_base_url: wss://stream.binance.com:9443/ws
  historical_limit: 1000
  request_timeout_seconds: 30
  live_stream_enabled: true
  market_data_touchpoints:
    - historical_klines
    - websocket_streams
    - exchange_info
  account_touchpoints:
    - account_info
    - open_orders
    - order_submission

risk:
  max_risk_per_trade: 0.01
  max_portfolio_exposure: 0.20

features:
  return_windows:
    - 1
    - 3
    - 6
  volatility_windows:
    - 5
    - 10
  trend_windows:
    - 5
    - 10
    - 20
  volume_windows:
    - 5
    - 10

backtest:
  initial_cash: 10000.0
  fee_rate: 0.001
  slippage_rate: 0.0005
  execution_price: next_open
  allocation_per_signal: 0.5

reporting:
  backtests_dir: data/results/backtests
  summaries_dir: data/results/summaries
