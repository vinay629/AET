app:
  mode: live
  logging_level: WARNING

paper:
  enabled: false

live:
  enabled: true  # Enable for live trading pilot
  require_explicit_confirmation: true  # Manual confirmation required
  simulation_mode: false  # Real orders on testnet (demo)
  testnet: true  # Use TESTNET (demo/sandbox) - NO REAL MONEY
  
  # Risk limits for testnet pilot (demo account)
  max_position_size_usdt: 25.0  # Max $25 per position (demo money)
  max_daily_loss_usdt: 10.0  # Stop if lose $10 in a day (demo)
  max_concurrent_positions: 2  # Max 2 open positions
  min_order_interval_seconds: 300  # 5 min between orders
  max_single_loss_usdt: 5.0  # Max $5 loss per position (demo)
  max_consecutive_losses: 3  # Stop after 3 losses
  
  # Account touchpoints (for testnet)
  account_touchpoints:
    - account_info
    - open_orders
    - order_status
    - balance_lookup
    - position_lookup
  
  # Order submission (TESTNET MODE - DEMO MONEY ONLY)
  order_submission:
    enabled: true  # REAL orders on testnet (no real money)
    max_order_size: 25.0  # USD - tiny size (demo)
    min_order_size: 10.0   # USD - minimum (demo)
    test_symbols:
      - BTCUSDT
      - ETHUSDT
  
  # Safety limits for testnet pilot
  safety:
    max_daily_trades: 5
    max_position_value: 25.0  # USD (demo)
    allowed_deviation_pct: 2.0  # Tighter price tolerance
    emergency_stop_file: "EMERGENCY_STOP.txt"


binance:
  live_stream_enabled: true
