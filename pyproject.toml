[project]
name = "baet"
version = "0.1.0"
description = "Binance Adaptive Ensemble Trader project scaffold"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "pandas>=2.3.0",
    "plotly>=6.7.0",
    "psutil>=7.2.2",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
research = [
    "numpy>=2.3.0",
    "scikit-learn>=1.7.0",
]
dashboard = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "plotly>=6.2.0",
]
monitoring = [
    "psutil>=7.0.0",
    "requests>=2.33.0",
]
websocket = [
    "websocket-client>=1.6.0",
]
notifications = [
    "apprise>=1.6.0",
]

[project.scripts]
baet = "baet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baet"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["baet"]

[[tool.mypy.overrides]]
module = [
    "plotly",
    "plotly.express",
    "plotly.graph_objects",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["baet.dashboard.data_loader"]
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "bandit>=1.7.5",
    "mypy>=1.18.0",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=3.0.0",
    "ruff>=0.12.0",
    "types-PyYAML>=6.0.12.20250915",
    "pip-audit>=2.6.1",
]
