[project]
name = "baet"
version = "0.1.0"
description = "Binance Adaptive Ensemble Trader project scaffold"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.0",
    "plotly>=6.7.0",
    "psutil>=7.2.2",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.8.0",
    "streamlit>=1.57.0",
]

[project.optional-dependencies]
research = [
    "numpy>=2.3.0",
    "scikit-learn>=1.7.0",
]
dashboard = [
    "streamlit>=1.57.0",
    "plotly>=6.2.0",
]
monitoring = [
    "psutil>=7.0.0",
    "requests>=2.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baet"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short --timeout=60"
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (moderate speed)",
    "e2e: End-to-end tests (slow)",
    "skip_ci: Skip in CI environment",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["baet"]

[dependency-groups]
dev = [
    "bandit>=1.7.5",
    "mypy>=1.18.0",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=3.0.0",
    "pytest>=8.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.12.0",
    "types-PyYAML>=6.0.12.20250915",
    "pip-audit>=2.6.1",
]
